<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title|e }}</title>
<meta name="description" content="{{ page.description|e }}" />
{% if page.canonical %}<link rel="canonical" href="{{ page.canonical|e }}" />{% endif %}
{{ head_extra }}
</head>
<body>
<nav class="nav">
  <div class="wrap">
    {{ logo }}

      {% for n in site.nav -%}

      {% endfor -%}
      <span class="nav-cta"><a href="{{ page.cta.href|e }}" class="{{ page.cta['class']|e }}" data-magnetic><span class="btn-label">{{ page.cta.label|e }}</span></a></span>
    </div>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-drawer">
  {% for n in site.nav -%}
  <a href="{{ n.href|e }}"{% if n.class %} class="{{ n.class|e }}"{% endif %}>{{ n.label|e }}</a>
  {% endfor -%}
  <a href="{{ page.cta.href|e }}" class="md-cta">{{ page.cta.label|e }}</a>
</div>

{{ body }}

{% if page.footer %}{{ footer }}{% endif %}
<script src="assets/site.js"></script>
{{ body_scripts }}
</body>
</html>
